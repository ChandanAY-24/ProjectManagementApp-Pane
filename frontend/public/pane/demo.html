<!doctype html>

<html lang="en" data-theme="dark" data-wall="ash" data-accent="blue" data-glass="tinted">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pane — a team workspace made of glass</title>
  <meta name="description" content="Pane is a project workspace for small teams: a home of live widgets, a drag-and-drop task board, a calendar, projects with milestones, insights, a team directory and settings — in liquid glass, light and dark." />
  <meta name="theme-color" content="#0a0a0c" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Pane — a team workspace made of glass" />
  <meta property="og:description" content="Tasks, calendar, projects, focus and insights for small teams, in liquid glass." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />
  <script>
    /* Before first paint: the saved look (theme, wallpaper, accent, glass),
       so the page never flashes the wrong colours. */
    (function (d) {
      d.classList.add('js');
      try {
        var l = JSON.parse(localStorage.getItem('pane:look') || '{}');
        var t = l.theme || 'dark';
        d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
        if (l.wall) d.dataset.wall = l.wall;
        if (l.accent) d.dataset.accent = l.accent;
        if (l.glass) d.dataset.glass = l.glass;
        if (l.solid) d.classList.add('is-solid');
      } catch (e) {}
      setTimeout(function () { d.classList.add('failsafe'); }, 4000);
    })(document.documentElement);
  </script>
  <script type="module" crossorigin src="/pane/assets/index-C7q0M8SS.js"></script>
  <link rel="stylesheet" crossorigin href="/pane/assets/index-B9QRu7KH.css">

</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <!-- The wallpaper (drawn by src/wall.ts). Everything else is glass, so
       this is what gives the whole app its colour. Static. -->
  <div class="wall" aria-hidden="true"></div>

  <div class="app">
    <aside class="side glass glass--chrome" aria-label="Workspace">
      <a class="brand" href="#/home" aria-label="Pane — home">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="3.5" y="3.5" width="17" height="17" rx="5.5"/><path d="M3.8 12.5c3.4-1.6 6.4-1.6 9 0s5.2 1.6 7.4 0"/></svg></span>
        <span class="brand__name">Pane</span>
      </a>
      <nav class="nav" aria-label="Main">
        <div class="nav__track">
          <span class="nav__lens" aria-hidden="true"></span>
          <a class="nav__item" href="#/home" data-route="home"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15V15a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5.5H5.5A1.5 1.5 0 0 1 4 19z"/></svg><span>Home</span></a>
          <a class="nav__item" href="#/tasks" data-route="tasks"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span>Tasks</span><b class="nav__count" id="count-tasks"></b></a>
          <a class="nav__item" href="#/calendar" data-route="calendar"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendar</span></a>
          <a class="nav__item" href="#/projects" data-route="projects"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span>Projects</span></a>
          <a class="nav__item" href="#/insights" data-route="insights"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4.5 19.5h15"/><path d="M7.5 16v-4.5M12 16V7.5M16.5 16v-6.5"/></svg><span>Insights</span></a>
          <a class="nav__item" href="#/team" data-route="team"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M3 19.5c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><path d="M15.5 5.2a3.5 3.5 0 0 1 0 6.6M17.5 14.8c1.8.6 3 2.2 3.5 4.7"/></svg><span>Team</span></a>
          <a class="nav__item" href="#/settings" data-route="settings"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l2 2.1 2.9-.4.7 2.8 2.6 1.4-1 2.8 1 2.8-2.6 1.4-.7 2.8-2.9-.4-2 2.1-2-2.1-2.9.4-.7-2.8-2.6-1.4 1-2.8-1-2.8 2.6-1.4.7-2.8 2.9.4Z"/></svg><span>Settings</span></a>
        </div>
      </nav>
      <div class="side__group">
        <p class="side__label" id="pinned-label">Pinned</p>
        <ul class="pinned" aria-labelledby="pinned-label"></ul>
      </div>
      <button type="button" class="side__me" id="btn-me" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">
        <img src="/pane/photos/174-pane/lin-zhao-sm.jpg" width="36" height="36" alt="" />
        <span><b>Lin Zhao</b><small>Product Lead</small></span>
        <svg class="ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg>
      </button>
    </aside>

    <header class="toolbar" aria-label="Toolbar">
      <div class="toolbar__title glass glass--chrome" aria-hidden="true"><span id="compact-title"></span></div>
      <div class="toolbar__tools glass glass--chrome">
        <button type="button" class="search-pill" id="btn-search" aria-label="Search (⌘K)">
          <svg class="ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <span>Search</span><kbd>⌘K</kbd>
        </button>
        <button type="button" class="tbtn" id="btn-new" aria-label="Create new" aria-haspopup="menu" aria-expanded="false" title="Create"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button type="button" class="tbtn" id="btn-theme" aria-label="Switch to dark theme" title="Theme"><svg class="ico ico--moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"/></svg><svg class="ico ico--sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
        <button type="button" class="tbtn" id="btn-bell" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false" title="Notifications"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="badge-dot" id="bell-badge" hidden></span></button>
        <button type="button" class="tbtn tbtn--me" id="btn-me-top" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false"><img src="/pane/photos/174-pane/lin-zhao-sm.jpg" width="32" height="32" alt="" /></button>
      </div>
    </header>

    <main id="main" class="main">
      <section class="view" data-view="home" hidden></section>
      <section class="view" data-view="tasks" hidden></section>
      <section class="view" data-view="calendar" hidden></section>
      <section class="view" data-view="projects" hidden></section>
      <section class="view" data-view="insights" hidden></section>
      <section class="view" data-view="team" hidden></section>
      <section class="view" data-view="settings" hidden></section>
    </main>

    <!-- Phone: the floating tab bar, with search split off into its own circle -->
    <nav class="tabbar" aria-label="Main">
      <div class="tabbar__bar glass glass--chrome">
        <div class="tabbar__track">
          <span class="tabbar__lens" aria-hidden="true"></span>
          <a class="tab" href="#/home" data-route="home"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15V15a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5.5H5.5A1.5 1.5 0 0 1 4 19z"/></svg><span>Home</span></a>
          <a class="tab" href="#/tasks" data-route="tasks"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span>Tasks</span></a>
          <a class="tab" href="#/calendar" data-route="calendar"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendar</span></a>
          <a class="tab" href="#/projects" data-route="projects"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span>Projects</span></a>
          <button type="button" class="tab" id="tab-more" data-route-more aria-haspopup="menu" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg><span>More</span></button>
        </div>
      </div>
      <button type="button" class="tabbar__search glass glass--chrome" id="btn-search-m" aria-label="Search"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
    </nav>
  </div>

  <div class="scrim" aria-hidden="true"></div>
  <div class="pop-layer"></div>

  <!-- The island: notifications and the focus timer -->
  <div class="island" data-mode="hidden">
    <div class="island__body">
      <button type="button" class="island__compact" aria-label="Focus timer"></button>
      <div class="island__note" role="status" aria-live="polite"></div>
      <div class="island__full" role="group" aria-label="Focus timer"></div>
    </div>
  </div>

  <dialog class="finder" id="finder" aria-label="Search Pane">
    <div class="finder__bar glass glass--thick">
      <svg class="ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="finder-q" type="text" role="combobox" aria-expanded="true" aria-controls="finder-list" aria-autocomplete="list" placeholder="Search tasks, projects, people…" autocomplete="off" spellcheck="false" />
      <kbd>esc</kbd>
    </div>
    <ul class="finder__list glass glass--thick" id="finder-list" role="listbox" aria-label="Results"></ul>
  </dialog>
  <dialog class="modal glass glass--thick" id="modal"></dialog>
  <dialog class="drawer glass glass--thick" id="drawer"></dialog>
</body>
</html>
